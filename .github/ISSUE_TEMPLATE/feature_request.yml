name: Feature request
description: Suggest a focused improvement to 240-MP Remote
title: "[Feature]: "
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What cannot be done today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional current workarounds or alternatives.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and kept this request focused.
          required: true
