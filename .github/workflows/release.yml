name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  release:
    name: Build and publish tagged FAP
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate version tag
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release refused: tag must match vMAJOR.MINOR.PATCH; found ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Run dependency-free host tests
        run: |
          set -euo pipefail
          make test

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Configure isolated uFBT state
        run: |
          set -euo pipefail
          printf 'UFBT_HOME=%s\n' "${RUNNER_TEMP}/ufbt" >> "${GITHUB_ENV}"

      - name: Set up pinned uFBT toolchain
        run: |
          set -euo pipefail
          make setup

      - name: Lint and build FAP
        run: |
          set -euo pipefail
          make lint
          make build

      - name: Generate release checksum
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum mp_240_remote.fap > mp_240_remote.fap.sha256
          sha256sum --check --strict mp_240_remote.fap.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            dist/mp_240_remote.fap \
            dist/mp_240_remote.fap.sha256
