name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run dependency-free host tests
        run: |
          set -euo pipefail
          make test

  fap:
    name: FAP build and lint (pinned toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Configure isolated uFBT state
        run: |
          set -euo pipefail
          printf 'UFBT_HOME=%s\n' "${RUNNER_TEMP}/ufbt" >> "${GITHUB_ENV}"

      - name: Set up pinned uFBT toolchain
        run: |
          set -euo pipefail
          make setup

      - name: Lint FAP sources
        run: |
          set -euo pipefail
          make lint

      - name: Build FAP
        run: |
          set -euo pipefail
          make build
